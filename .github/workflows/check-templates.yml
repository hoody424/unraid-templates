name: Check templates

# Weekly: catches images that disappeared or went private, dead icons and
# upstreams that stopped publishing. A failed run sends a GitHub notification.
on:
  push:
    branches: [main]
    paths:
      - "*/*.xml"
      - ca_profile.xml
      - .github/scripts/check_templates.py
      - .github/workflows/check-templates.yml
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/check_templates.py
