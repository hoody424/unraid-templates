name: yopass image

on:
  push:
    branches: [main]
    paths:
      - yopass/image/**
      - .github/workflows/yopass.yml
  # Weekly rebuild picks up new Yopass releases and Debian package fixes
  # (no build cache is used).
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: Yopass release to build (empty = newest)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT: ${{ inputs.version }}
        run: |
          version=${INPUT:-$(gh api repos/jhaals/yopass/releases/latest --jq .tag_name)}
          echo "Yopass $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: yopass/image
          build-args: YOPASS_VERSION=${{ steps.version.outputs.version }}
          no-cache: ${{ github.event_name == 'schedule' }}
          load: true
          tags: yopass:test

      # Store a real PGP message, read it back once, and check the UI is built
      # with relative URLs.
      - name: Smoke test
        run: |
          docker run -d --name yopass -p 1337:1337 yopass:test
          for _ in $(seq 30); do curl -sf http://127.0.0.1:1337/config >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:1337/ | grep -q 'src="./assets/'
          msg=$(echo smoke | gpg --batch --quiet --symmetric --armor --passphrase x --pinentry-mode loopback)
          id=$(jq -n --arg m "$msg" '{message: $m, expiration: 3600, one_time: true}' \
            | curl -sf -H 'Content-Type: application/json' -d @- http://127.0.0.1:1337/create/secret | jq -r .message)
          curl -sf "http://127.0.0.1:1337/secret/$id" | jq -r .message \
            | gpg --batch --quiet --decrypt --passphrase x --pinentry-mode loopback | grep -qx smoke
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:1337/secret/$id")" = 404
          sleep 35
          test "$(docker inspect -f '{{.State.Health.Status}}' yopass)" = healthy
          docker logs yopass

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hoody424/yopass
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # Same inputs as the Build step, so the layers come from its cache.
      - uses: docker/build-push-action@v6
        with:
          context: yopass/image
          build-args: YOPASS_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
