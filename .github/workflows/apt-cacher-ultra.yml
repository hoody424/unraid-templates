name: apt-cacher-ultra image

on:
  push:
    branches: [main]
    paths:
      - apt-cacher-ultra/image/**
      - .github/workflows/apt-cacher-ultra.yml
  # Weekly rebuild picks up new apt-cacher-ultra releases and Alpine package
  # fixes (no build cache is used).
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: apt-cacher-ultra release to build (empty = newest)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT: ${{ inputs.version }}
        run: |
          version=${INPUT:-$(gh api repos/linsomniac/apt-cacher-ultra/releases/latest --jq .tag_name)}
          echo "apt-cacher-ultra $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: apt-cacher-ultra/image
          build-args: ACU_VERSION=${{ steps.version.outputs.version }}
          no-cache: ${{ github.event_name == 'schedule' }}
          load: true
          tags: apt-cacher-ultra:test

      # Default config is written, a Debian index is fetched twice through the
      # proxy (second time from cache), the admin login works.
      - name: Smoke test
        run: |
          mkdir -p cfg cache
          docker run -d --name acu -p 3142:3142 -p 6789:6789 -e ADMIN_PASSWORD=smoke \
            -v "$PWD/cfg:/config" -v "$PWD/cache:/cache" apt-cacher-ultra:test
          for _ in $(seq 30); do curl -sf -u admin:smoke http://127.0.0.1:6789/healthz >/dev/null && break; sleep 1; done
          test -f cfg/config.toml
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6789/healthz)" = 401
          url=http://deb.debian.org/debian/dists/stable/InRelease
          curl -sf -x http://127.0.0.1:3142 -o first $url
          curl -sf -x http://127.0.0.1:3142 -o second $url
          cmp first second
          grep -q 'Origin: Debian' first
          sleep 65
          test "$(docker inspect -f '{{.State.Health.Status}}' acu)" = healthy
          docker logs acu

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hoody424/apt-cacher-ultra
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # Same inputs as the Build step, so the layers come from its cache.
      - uses: docker/build-push-action@v6
        with:
          context: apt-cacher-ultra/image
          build-args: ACU_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
